site_name: Tally Prime & GST Mastery Path
site_description: A structured, module-wise TallyPrime and GST accounting training program from entry level to master level, covering bookkeeping, inventory, GST returns, TDS, payroll and year-end closing.
site_url: https://learnmasterypath.com/tally-gst-mastery-path/
repo_url: https://github.com/SIGILIPELLI/tally-gst-mastery-path
repo_name: tally-gst-mastery-path

theme:
  name: material
  font: false
  favicon: assets/favicon.svg
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.path
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/progress-tracker.css
  - stylesheets/final-quiz.css

extra_javascript:
  - javascripts/progress-tracker.js
  - javascripts/final-quiz.js






extra:
  related:
    - name: "Excel"
      url: https://learnmasterypath.com/excel-mastery-path/
    - name: "English Fluency & IELTS"
      url: https://learnmasterypath.com/english-fluency-mastery-path/
    - name: "Workday"
      url: https://learnmasterypath.com/workday-mastery-path/
    - name: "Digital Marketing & SEO"
      url: https://learnmasterypath.com/digital-marketing-mastery-path/

not_in_nav: |
  privacy.md
  license.md

